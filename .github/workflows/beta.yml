# Manual beta release.
#
# Trigger from the Actions tab (Run workflow) with a version label like
# `v0.2.0-beta.1`. Builds the same asset set as release.yml and publishes
# it as a *prerelease*. The tag is created by the release, pointing at the
# commit the workflow ran on.

name: beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version tag (e.g. v0.2.0-beta.1)'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: 'Manual beta build.'

permissions:
  contents: write

jobs:
  beta:
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ inputs.version }}
      prerelease: true
      notes: ${{ inputs.notes }}
      target: ${{ github.sha }}
    secrets: inherit
